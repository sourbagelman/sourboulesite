name = "sour-boule-new-year-staging"
main = "src/worker.mjs"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "sour-boule-nye-staging"
database_id = "REPLACE_WITH_NEW_STAGING_DATABASE_ID"
migrations_dir = "migrations"

[vars]
WEBSITE_ORIGINS = "https://thesourboule.com,https://www.thesourboule.com"
ACCESS_ISSUER = "https://REPLACE.cloudflareaccess.com"
ACCESS_AUD = "REPLACE_WITH_STAFF_ACCESS_APPLICATION_AUD"
# PASS_SECRET must be a server-side secret (32+ random bytes), not a vars entry.
# No production route is configured. Do not deploy until release is authorized.
